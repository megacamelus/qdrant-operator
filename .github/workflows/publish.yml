
name: Push

on:
  workflow_call:
    inputs:
      container-image-name:
        required: true
        type: string
      container-image-version:
        required: true
        type: string
    secrets:
      registry:
        required: true
      registry-username:
        required: true
      registry-password:
        required: true

jobs:
  publish:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
      - name: "Login to Container registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.registry }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}
      - name: Set versions
        run: |
          export INPUT_NAME="${{ inputs.container-image-name }}"
          export INPUT_VERSION="${{ inputs.container-image-version }}"
          export C_VERSION="${INPUT_VERSION#v}"
          

          echo "CONTAINER_IMAGE_TAG_BASE=${INPUT_NAME}" >> $GITHUB_ENV
          echo "CONTAINER_IMAGE_VERSION=${C_VERSION}" >> $GITHUB_ENV
      - name: "Build Qdrant Operator Container image"
        run: |
          echo "Container Image Base    : ${CONTAINER_IMAGE_TAG_BASE}"
          echo "Container Image Version : ${CONTAINER_IMAGE_VERSION}"
          
          make docker-build
          make docker-push
