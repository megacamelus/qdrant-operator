name: "e2e - operator"

on:
  workflow_call:

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
      - name: "Publish Image"
        id: "publish"
        run: |
          export UUID=$(uuidgen | tr "[:upper:]" "[:lower:]")
          export CONTAINER_IMAGE="ttl.sh/${UUID}-${GITHUB_RUN_ID}-${GITHUB_RUN_NUMBER}:1h"
          
          echo ${CONTAINER_IMAGE}
          echo "image=${CONTAINER_IMAGE}" >> "$GITHUB_OUTPUT"
          
          make docker-build docker-push
  e2e-operator:
    runs-on: ubuntu-latest
    needs:
      - images
    env:
      CONTAINER_IMAGE: ${{needs.images.outputs.image}}
    strategy:
      matrix:
        kubernetes-version:
          - "1.27.11"
          - "1.28.7"
          - "1.29.2"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "SetUp Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
      - name: 'SetUp KinD'
        uses: container-tools/kind-action@v2.0.4
        with:
          version: "v0.22.0"
          kubectl_version: v${{ matrix.kubernetes-version }}
          registry: false
          node_image: kindest/node:v${{ matrix.kubernetes-version }}
      - name: "SetUp Qdrant Operator"
        run: |
          ./hack/scripts/deploy_e2e.sh
      - name: "Run Qdrant Operator e2e"
        run: |
          make test/e2e
